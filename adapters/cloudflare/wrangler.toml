name = "padel-counter"
main = "src/index.ts"
compatibility_date = "2026-10-27"

[vars]
ENVIRONMENT = "production"

[[durable_objects.bindings]]
name = "MATCH_ROOMS"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[d1_databases]]
binding = "DB"
database_name = "padel-counter"
database_id = "11111111-1111-4111-8111-111111111111"
migrations_dir = "migrations"

[env.dev]
name = "padel-counter-dev"

[env.dev.vars]
ENVIRONMENT = "development"

[[env.dev.durable_objects.bindings]]
name = "MATCH_ROOMS"
class_name = "MatchRoom"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "padel-counter-dev"
database_id = "22222222-2222-4222-8222-222222222222"
migrations_dir = "migrations"

[env.staging]
name = "padel-counter-staging"

[env.staging.triggers]
crons = ["17 3 * * *"]

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "MATCH_ROOMS"
class_name = "MatchRoom"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "padel-counter-staging"
database_id = "33333333-3333-4333-8333-333333333333"
migrations_dir = "migrations"

[env.production]
name = "padel-counter"

[env.production.triggers]
crons = ["17 3 * * *"]

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.durable_objects.bindings]]
name = "MATCH_ROOMS"
class_name = "MatchRoom"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "padel-counter"
database_id = "11111111-1111-4111-8111-111111111111"
migrations_dir = "migrations"
