name = "padel-counter"
main = "src/index.ts"
compatibility_date = "2026-10-27"

[vars]
ENVIRONMENT = "production"

[[durable_objects.bindings]]
name = "MATCH_ROOMS"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[d1_databases]]
binding = "DB"
database_name = "padel-counter"
database_id = "f7d1464e-628a-4959-83bd-9ac0739a0078"
migrations_dir = "migrations"

[[ratelimits]]
name = "REQUEST_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 30
period = 60

[env.dev]
name = "padel-counter-dev"

[env.dev.vars]
