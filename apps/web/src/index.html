<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a1a3f" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Padel Counter tracks games on this device. A QR code can share the live score."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'<%= connectSrc %>; worker-src 'self'; manifest-src 'self'; media-src 'none'; upgrade-insecure-requests"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Padel Counter V2" />
    <title>Padel Counter V2</title>
    <link rel="manifest" href="<%= assetPrefix %>/manifest.webmanifest" />
    <link rel="icon" href="<%= assetPrefix %>/favicon.ico" sizes="any" />
    <link rel="icon" href="<%= assetPrefix %>/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="<%= assetPrefix %>/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="<%= assetPrefix %>/icons/apple-touch-icon-180.png" sizes="180x180" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p class="noscript">Padel Counter needs JavaScript. The score on this device still needs it. Live sharing needs it too.</p>
    </noscript>
  </body>
</html>
